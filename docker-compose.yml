services:
  recording-manager:
    build: .
    container_name: enigma2-recording-manager
    restart: unless-stopped
    ports:
      - "8090:8000"
    environment:
      ENIGMA_HOST: "192.168.0.5"
      ENIGMA_PORT: "80"
      # Falls im OpenWebif ein Login aktiviert ist:
      # ENIGMA_USER: ""
      # ENIGMA_PASS: ""
      CHECK_INTERVAL_HOURS: "6"
      TZ: "Europe/Berlin"
      # Optional: Basic-Auth fuer dieses Webinterface selbst (empfohlen,
      # da hier Aufnahmen geloescht werden koennen)
      # MANAGER_USER: "admin"
      # MANAGER_PASS: "changeme"
    volumes:
      - ./data:/data
